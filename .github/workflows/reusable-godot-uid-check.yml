name: B44 Godot UID sidecar check

# Godot writes a .uid file beside every C# script under the project directory
# and uses it as the stable identifier for that script. The project keeps
# working locally without one, because the editor regenerates it on the next
# open — and that is exactly why the gap survives review: it only breaks after
# a fresh clone, which for most people means CI or another machine.
#
# This check reports scripts that are tracked without their sidecar. It never
# writes one. A UID is the Godot editor's to allocate, and a fabricated value
# is worse than a missing file: it looks authoritative and resolves to nothing.
# The required action is always the same and is stated in the failure — open
# the project in the Godot editor once, then commit what it generates.
#
# Lives in B44.Godot rather than B44.Standards because the rule needs to know
# what a Godot project is. B44.Standards owns the half that does not: a tracked
# .uid whose script no longer exists is an orphan, and its repository-hygiene
# check reports that with no engine knowledge at all.

on:
  workflow_call:
    inputs:
      project-path:
        description: 'Directory holding project.godot, relative to the repository root.'
        required: false
        type: string
        default: '.'
      exclude:
        description: >-
          Newline-separated repository-relative path prefixes to skip, for
          directories Godot does not import. Use sparingly: Godot generates a
          sidecar for every C# file under the project directory, including
          engine-free Core and test projects it never loads, and those are
          committed too.
        required: false
        type: string
        default: ''

jobs:
  uid-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for missing .uid sidecars
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ inputs.project-path }}"

          if [ ! -f project.godot ]; then
            echo "::error::No project.godot in '${{ inputs.project-path }}'. This check is for Godot projects; point project-path at the directory holding it."
            exit 1
          fi

          # git is the authority, not the filesystem: the question is whether
          # the sidecar is COMMITTED. An untracked one on a developer's machine
          # is exactly the state that breaks the next clone.
          mapfile -t scripts < <(git ls-files '*.cs' | grep -vE '(^|/)(obj|bin)/' || true)

          excluded() {
            [ -z "${{ inputs.exclude }}" ] && return 1
            while IFS= read -r prefix; do
              [ -z "$prefix" ] && continue
              case "$1" in "$prefix"*) return 0 ;; esac
            done <<< "${{ inputs.exclude }}"
            return 1
          }

          missing=()
          for f in "${scripts[@]}"; do
            excluded "$f" && continue
            if [ -z "$(git ls-files "$f.uid")" ]; then
              missing+=("$f")
            fi
          done

          if [ ${#missing[@]} -eq 0 ]; then
            echo "All ${#scripts[@]} tracked C# scripts have a committed .uid sidecar."
            exit 0
          fi

          for f in "${missing[@]}"; do
            echo "::error file=$f::Missing Godot .uid sidecar for $f. Open the project in the Godot editor once so it generates $f.uid, then commit it. Do not hand-write a UID."
          done
          echo "::error::${#missing[@]} tracked C# script(s) have no committed .uid sidecar. Godot allocates these; open the editor once and commit what it writes. References break on the next fresh clone without them."
          exit 1
