name: B44 Godot composition smoke

# Headless composition smoke test for a B44 game. Boots the project with the
# B44SmokeRunner scene and asserts on the standardized marker and exit code.
#
# The marker contract is owned by B44.Godot (see SmokeEvaluation), not by this
# workflow and not by the calling game.

on:
  workflow_call:
    inputs:
      godot-version:
        description: >-
          Godot version to install, e.g. 4.7.0. Required with no default: each
          game owns the version it tests against, so B44.Godot never needs
          editing when Godot releases.
        required: true
        type: string
      smoke-scene:
        description: 'Scene containing B44SmokeRunner, e.g. res://tests/Smoke.tscn'
        required: true
        type: string
      project-path:
        description: 'Directory holding project.godot, relative to the repository root.'
        required: false
        type: string
        default: '.'
      dotnet-version:
        description: 'SDK used to build the game assembly before booting Godot.'
        required: false
        type: string
        default: '10.0.x'
      timeout-minutes:
        description: >-
          Job timeout. A project that fails to exit must fail the job rather
          than hang the runner until the org-wide limit.
        required: false
        type: number
        default: 10

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Authenticate GitHub Packages
        shell: bash
        env:
          NUGET_AUTH_TOKEN: ${{ github.token }}
          NUGET_AUTH_USERNAME: ${{ github.actor }}
        run: |
          set -euo pipefail
          # NuGet reads this well-known environment variable for the existing
          # source named "github". Keep the token out of NuGet.Config so the
          # caller's short-lived GITHUB_TOKEN never reaches the checkout.
          echo "NuGetPackageSourceCredentials_github=Username=${NUGET_AUTH_USERNAME};Password=${NUGET_AUTH_TOKEN};ValidAuthenticationTypes=Basic" >> "$GITHUB_ENV"

      - name: Verify the requested Godot version matches the project SDK
        shell: bash
        working-directory: ${{ inputs.project-path }}
        run: |
          set -euo pipefail
          requested='${{ inputs.godot-version }}'
          # Godot.NET.Sdk/<version> in any csproj here is the authority on what
          # the game actually compiles against. Booting a different engine build
          # produces failures that look like the game's fault and are not.
          sdk="$(grep -rhoE 'Godot\.NET\.Sdk/[0-9]+\.[0-9]+\.[0-9]+' --include='*.csproj' . \
                 | head -1 | cut -d/ -f2 || true)"
          if [ -z "$sdk" ]; then
            echo "No Godot.NET.Sdk reference found; skipping the compatibility check."
            exit 0
          fi
          echo "Project SDK: $sdk / requested engine: $requested"
          if [ "$sdk" != "$requested" ]; then
            echo "::error::godot-version '$requested' does not match Godot.NET.Sdk '$sdk'." \
                 "Booting a mismatched engine reports failures that look like the game's fault." \
                 "Pass godot-version: '$sdk', or raise the SDK deliberately."
            exit 1
          fi

      - name: Install Godot ${{ inputs.godot-version }} (headless)
        shell: bash
        run: |
          set -euo pipefail
          version='${{ inputs.godot-version }}'
          # Godot tags a .0 release as "4.7-stable", not "4.7.0-stable" — only
          # patches carry the third component. NuGet versions always carry all
          # three, so Godot.NET.Sdk/4.7.0 corresponds to engine release 4.7.
          # Normalise, or every .0 release 404s.
          release="${version%.0}"
          base="https://github.com/godotengine/godot/releases/download/${release}-stable"
          zip="Godot_v${release}-stable_mono_linux_x86_64.zip"
          echo "SDK version $version -> engine release $release"
          curl -fsSL --retry 3 --retry-delay 5 -o godot.zip "${base}/${zip}"
          unzip -q godot.zip

          # Locate the executable rather than reconstructing its name. The mono
          # archive extracts a folder using "_x86_64" while the binary inside
          # uses ".x86_64" — an underscore in one and a dot in the other — and
          # that convention has shifted across releases. Searching is stable;
          # guessing is how this step failed twice.
          bin="$(find . -maxdepth 3 -type f -name 'Godot_v*_mono_linux*' ! -name '*.zip' | head -1)"
          if [ -z "$bin" ]; then
            echo "::error::Godot binary not found after extracting ${zip}. Archive contents:"
            find . -maxdepth 3 -name 'Godot_v*' | head -20
            exit 1
          fi
          chmod +x "$bin"
          echo "GODOT_BIN=$(realpath "$bin")" >> "$GITHUB_ENV"
          echo "Using $(realpath "$bin")"

      - name: Build the game assembly
        shell: bash
        working-directory: ${{ inputs.project-path }}
        run: |
          set -euo pipefail
          # Build the Godot project file, not the solution. Godot-generated
          # solutions frequently define only ExportDebug/ExportRelease/Release
          # and no plain Debug, so a solution-level `--configuration Debug`
          # fails with MSB4126 even though the project itself builds fine —
          # Godot.NET.Sdk defines Debug at the project level.
          proj="$(ls *.csproj 2>/dev/null | head -1)"
          if [ -z "$proj" ]; then
            echo "::error::No .csproj beside project.godot in '${{ inputs.project-path }}'."
            exit 1
          fi
          echo "Building $proj"
          dotnet build "$proj" --configuration Debug /nodeReuse:false -p:UseSharedCompilation=false -m:1

      - name: Point the project at the smoke scene
        shell: bash
        working-directory: ${{ inputs.project-path }}
        env:
          SMOKE_SCENE: ${{ inputs.smoke-scene }}
        run: |
          set -euo pipefail
          # Passing a scene path on Godot's command line LOADS it as a resource
          # but does not replace the configured main scene: the project starts
          # its own main scene and the harness node is never instantiated.
          # Verified 2026-07-31 — the smoke scene and the game's title scene
          # both appeared in the load log, and the runner's _Ready never ran.
          #
          # Overriding run/main_scene makes the harness the main scene, so the
          # engine takes its completely normal startup path, which is the path
          # this test exists to exercise. The checkout is disposable, so
          # mutating project.godot affects nothing beyond this job.
          python3 - <<'PY'
          import os, re
          scene = os.environ["SMOKE_SCENE"]
          path = "project.godot"
          text = open(path, encoding="utf-8").read()
          if re.search(r"^run/main_scene=", text, re.M):
              text = re.sub(r"^run/main_scene=.*$", f'run/main_scene="{scene}"', text, count=1, flags=re.M)
          elif "[application]" in text:
              text = text.replace("[application]", "[application]" + chr(10) + f'run/main_scene="{scene}"', 1)
          else:
              raise SystemExit("project.godot has no [application] section to set run/main_scene in")
          open(path, "w", encoding="utf-8").write(text)
          print(f"main scene -> {scene}")
          PY

      - name: Import resources
        shell: bash
        working-directory: ${{ inputs.project-path }}
        # A cold checkout has no .godot/ import cache. Without this the first
        # real run fails on unimported resources rather than on composition,
        # which is the failure we actually want to detect. Import is allowed to
        # report errors; the smoke run is the gate.
        run: timeout 300 "$GODOT_BIN" --headless --import || true

      - name: Run composition smoke test
        id: smoke
        shell: bash
        working-directory: ${{ inputs.project-path }}
        run: |
          set -uo pipefail
          # Godot's CLI scene argument is a project-relative FILE path, not a
          # res:// URI. Passing res:// is accepted silently and then ignored:
          # the engine prints its banner, starts no scene at all, and sits
          # until the job timeout kills it. The input stays res://-shaped
          # because that is how the path is written everywhere else in a Godot
          # project; the prefix is stripped here.
          scene='${{ inputs.smoke-scene }}'
          echo "Smoke scene: $scene"
          set +e
          # --verbose because a crash here otherwise leaves nothing to work
          # with: a SIGABRT produced a log containing only the version banner,
          # which is indistinguishable from the engine doing nothing at all.
          # stdbuf defeats block buffering, which is why output is lost when
          # the process dies rather than exits.
          # No --quit-after. Verified 2026-08-01 against a deliberately simple game:
          # with it, the engine loads the main scene and exits before ever
          # instantiating it — the log ends with "Completed load for Smoke.tscn"
          # followed straight by "Unloading", and _Ready never runs. The harness
          # calls GetTree().Quit() itself once it has a verdict, and the job
          # timeout is the real backstop for an engine that never loads it.
          stdbuf -oL -eL "$GODOT_BIN" --headless --verbose 2>&1 | tee smoke.log
          # tee is in the pipeline, so read Godot's status rather than tee's.
          status="${PIPESTATUS[0]}"
          set -e
          echo "exit-code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Assert marker and exit code
        shell: bash
        working-directory: ${{ inputs.project-path }}
        run: |
          set -euo pipefail
          status='${{ steps.smoke.outputs.exit-code }}'

          if grep -q 'B44_SMOKE_FAIL' smoke.log; then
            echo "::error::Composition smoke test failed. Report:"
            sed -n '/B44_SMOKE_FAIL/,$p' smoke.log | head -40
            exit 1
          fi

          # 134 is SIGABRT, 139 SIGSEGV — the engine died rather than exited,
          # so name that instead of reporting a missing marker, which sounds
          # like a configuration problem and is not.
          if [ "$status" -gt 128 ] 2>/dev/null; then
            echo "::error::Godot terminated on signal $((status - 128)) (exit $status)."                  "This is an engine crash, not a failed assertion. Last output:"
            tail -60 smoke.log
            exit 1
          fi

          if ! grep -q 'B44_SMOKE_PASS' smoke.log; then
            # No marker at all means the harness never reached its verdict: a
            # crash, a hang killed by the job timeout, or a scene that never
            # loaded B44SmokeRunner. Distinct from an honest failure.
            echo "::error::No B44 smoke marker in output (exit code $status)." \
                 "The harness never reported a verdict — the project likely crashed" \
                 "during startup, or the smoke scene does not contain B44SmokeRunner."
            tail -40 smoke.log
            exit 1
          fi

          if [ "$status" != "0" ]; then
            echo "::error::Smoke test printed a pass marker but exited $status."
            exit 1
          fi

          echo "Composition smoke test passed."

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-smoke-log
          path: ${{ inputs.project-path }}/smoke.log
          if-no-files-found: ignore
